<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>مترجم الويب</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"مترجم الويب","short_name":"مترجم","display":"standalone","start_url":".","background_color":"#F3F6F4","theme_color":"#0E7C86","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230E7C86%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2765%27 text-anchor=%27middle%27 fill=%27white%27%3Eع%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F4;--surface:#FFFFFF;--ink:#14202B;--muted:#5B6B76;--accent:#0E7C86;--accent-ink:#FFFFFF;--line:#D5DEDA;--warn:#B3421F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0F171C;--surface:#17232A;--ink:#E7EEEC;--muted:#97A8B0;--accent:#3FB6C0;--accent-ink:#06191C;--line:#2A3A43;--warn:#F08B68}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 14px}
.bar{display:flex;gap:8px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea{min-height:110px;resize:vertical;margin-top:8px}
button{font:inherit;font-weight:500;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>*{flex:1}
details{margin-top:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:500}
label{display:block;margin-top:10px;color:var(--muted);font-size:.9rem}
#status{margin:14px 0 0;color:var(--muted);min-height:1.5em}
#status.err{color:var(--warn)}
#out{margin-top:10px}
.blk{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.blk h2,.blk h3{margin:0;line-height:1.4}
.blk p{margin:0}
.orig{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);direction:ltr;text-align:left;font-size:.92rem}
.show-orig .orig{display:block}
.tools{display:none;gap:8px;margin-top:14px}
.tools.on{display:flex}
.tools button{flex:1}
</style>
</head>
<body>
<main>
<h1>مترجم الويب بالذكاء الاصطناعي</h1>

<div class="bar">
  <input id="url" type="url" inputmode="url" dir="ltr" placeholder="الصق رابط الصفحة هنا" autocomplete="off">
  <button id="go">ترجم</button>
</div>
<textarea id="txt" dir="auto" placeholder="أو الصق نصاً مباشرة لترجمته"></textarea>
<div class="row"><button id="goTxt" class="ghost">ترجم النص</button></div>

<details id="set">
  <summary>الإعدادات</summary>
  <label for="engine">طريقة الترجمة</label>
  <select id="engine">
    <option value="gc">أدق: Gemini يترجم و Claude يراجع</option>
    <option value="cg">أدق: Claude يترجم و Gemini يراجع</option>
    <option value="gemini">Gemini فقط</option>
    <option value="claude">Claude فقط</option>
  </select>
  <label for="key">مفتاح Gemini (مجاني من aistudio.google.com/apikey)</label>
  <input id="key" type="password" dir="ltr" autocomplete="off" placeholder="AIza...">
  <label for="model">نموذج Gemini</label>
  <select id="model">
    <option value="gemini-3.7-flash">Gemini 3.7 Flash (الأحدث)</option>
    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (الأسرع)</option>
  </select>
  <label for="ckey">مفتاح Claude (من console.anthropic.com)</label>
  <input id="ckey" type="password" dir="ltr" autocomplete="off" placeholder="sk-ant-...">
  <label for="cmodel">نموذج Claude</label>
  <select id="cmodel">
    <option value="claude-opus-5-5">Claude Opus 5.5 (الأدق)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (متوازن)</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 (الأسرع)</option>
  </select>
  <label for="lang">الترجمة إلى</label>
  <select id="lang">
    <option value="العربية الفصحى المبسطة">العربية</option>
    <option value="English">English</option>
    <option value="Français">Français</option>
    <option value="Türkçe">Türkçe</option>
  </select>
  <div class="row"><button id="save">حفظ</button></div>
</details>

<p id="status" role="status"></p>
<div class="tools" id="tools">
  <button class="ghost" id="tog">إظهار الأصل</button>
  <button class="ghost" id="copy">نسخ</button>
  <button class="ghost" id="open">فتح الأصل</button>
</div>
<div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, v) } catch(e){} }
};
$('key').value = store.get('key', '');
$('ckey').value = store.get('ckey', '');
$('model').value = store.get('model', 'gemini-3.7-flash');
$('cmodel').value = store.get('cmodel', 'claude-opus-5-5');
$('engine').value = store.get('engine', 'gemini');
$('lang').value = store.get('lang', 'العربية الفصحى المبسطة');
if (!$('key').value && !$('ckey').value) $('set').open = true;

$('save').onclick = () => {
  ['key','ckey','model','cmodel','engine','lang'].forEach(k => store.set(k, $(k).value.trim()));
  say('تم حفظ الإعدادات');
  $('set').open = false;
};

function say(m, err){ const s = $('status'); s.textContent = m; s.className = err ? 'err' : ''; }

let lastUrl = '', translated = [];

const NEED = {gemini: ['key', 'مفتاح Gemini'], claude: ['ckey', 'مفتاح Claude']};

async function callModel(p, text, sys){
  const key = store.get(NEED[p][0], '');
  if (!key){ $('set').open = true; throw new Error('أضف ' + NEED[p][1] + ' في الإعدادات'); }
  if (p === 'gemini'){
    const model = store.get('model', 'gemini-3.7-flash');
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text }] }], generationConfig: { temperature: 0.2 } })
    });
    const j = await r.json();
    if (!r.ok) throw new Error('Gemini: ' + ((j.error && j.error.message) || r.status) + ' (جرّب نموذجاً آخر من الإعدادات)');
    const parts = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts;
    if (!parts) throw new Error('لم يرجع Gemini ترجمة. جرّب نصاً أقصر');
    return parts.map(x => x.text || '').join('');
  }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: store.get('cmodel', 'claude-opus-5-5'), max_tokens: 8000, temperature: 0.2, system: sys, messages: [{ role: 'user', content: text }] })
  });
  const j = await r.json();
  if (!r.ok) throw new Error('Claude: ' + ((j.error && j.error.message) || r.status));
  return (j.content || []).map(x => x.text || '').join('');
}

async function translate(text){
  const lang = store.get('lang', 'العربية الفصحى المبسطة');
  const fmt = ' Keep names, numbers, code and URLs as they are. Preserve structure: keep markdown headings (#) and put each paragraph on its own line separated by a blank line. Output only the final text, with no notes.';
  const sysT = 'You are a professional translator. Translate the user text into ' + lang + ' accurately and naturally. Keep the meaning exact; do not summarize, add, or omit anything.' + fmt;
  const sysR = 'You are a senior translation editor. You get an ORIGINAL text and a DRAFT translation into ' + lang + '. Fix any mistranslation, omission, addition, or unnatural phrasing, and return the corrected full translation.' + fmt;
  const eng = store.get('engine', 'gemini');
  const order = { gemini: ['gemini'], claude: ['claude'], gc: ['gemini', 'claude'], cg: ['claude', 'gemini'] }[eng] || ['gemini'];
  let tr = await callModel(order[0], text, sysT);
  if (order[1]) tr = await callModel(order[1], 'ORIGINAL:\n' + text + '\n\nDRAFT TRANSLATION:\n' + tr, sysR);
  return tr;
}

function chunks(text, max = 3000){
  const paras = text.split(/\n{2,}/), out = [];
  let cur = '';
  for (const p of paras){
    if ((cur + '\n\n' + p).length > max && cur){ out.push(cur); cur = p; }
    else cur = cur ? cur + '\n\n' + p : p;
  }
  if (cur) out.push(cur);
  return out;
}

function clean(md){
  return md
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^(Title|URL Source|Markdown Content|Published Time):.*$/gm, '')
    .replace(/\n{3,}/g, '\n\n').trim();
}

function addBlocks(orig, tr){
  const o = orig.split(/\n{2,}/), t = tr.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  const same = o.length === t.length;
  t.forEach((line, i) => {
    const m = line.match(/^(#{1,6})\s+(.*)$/);
    const el = document.createElement('div'); el.className = 'blk';
    const h = document.createElement(m ? (m[1].length === 1 ? 'h2' : 'h3') : 'p');
    h.textContent = (m ? m[2] : line).replace(/\*\*/g, '');
    el.appendChild(h);
    if (same){ const og = document.createElement('div'); og.className = 'orig'; og.textContent = o[i].replace(/^#+\s*/, ''); el.appendChild(og); }
    $('out').appendChild(el);
  });
}

async function run(source, isUrl){
  $('out').innerHTML = ''; translated = []; $('tools').classList.remove('on');
  $('go').disabled = $('goTxt').disabled = true;
  try {
    let text = source;
    if (isUrl){
      let u = source.trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      lastUrl = u;
      say('جاري جلب الصفحة...');
      const r = await fetch('https://r.jina.ai/' + u);
      if (!r.ok) throw new Error('تعذر جلب الصفحة (' + r.status + '). جرّب لصق النص مباشرة');
      text = clean(await r.text());
      if (!text) throw new Error('الصفحة فارغة أو محمية');
    } else lastUrl = '';
    const parts = chunks(text);
    for (let i = 0; i < parts.length; i++){
      say('جاري الترجمة... ' + (i + 1) + ' من ' + parts.length);
      const tr = await translate(parts[i]);
      translated.push(tr);
      addBlocks(parts[i], tr);
      $('tools').classList.add('on');
    }
    say('تمت الترجمة');
  } catch (e){
    say(e.message || String(e), true);
  } finally {
    $('go').disabled = $('goTxt').disabled = false;
  }
}

$('go').onclick = () => { const v = $('url').value.trim(); if (v) run(v, true); else say('الصق رابطاً أولاً', true); };
$('goTxt').onclick = () => { const v = $('txt').value.trim(); if (v) run(v, false); else say('الصق نصاً أولاً', true); };
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

$('tog').onclick = () => {
  const on = $('out').classList.toggle('show-orig');
  $('tog').textContent = on ? 'إخفاء الأصل' : 'إظهار الأصل';
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(translated.join('\n\n')); say('تم النسخ'); }
  catch(e){ say('تعذر النسخ', true); }
};
$('open').onclick = () => { if (lastUrl) window.open(lastUrl, '_blank', 'noopener'); else say('لا يوجد رابط أصلي', true); };

// Opened via share target / ?u=
const q = new URLSearchParams(location.search).get('u');
if (q){ $('url').value = q; }
</script>
</body>
</html>
